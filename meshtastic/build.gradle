// https://github.com/google/protobuf-gradle-plugin/blob/master/examples/exampleProject/build.gradle
plugins {
    id "java"
    id 'maven-publish'
}

group = "io.github.s7i"
version = rootProject.file('version').text.trim()

ext {
    grcpVersion= '1.51.0'
    proto = '3.21.9'
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.5'
    implementation "io.github.s7i.meshtastic.proto:meshtastic-proto:1.0"
    implementation "com.google.protobuf:protobuf-java:${proto}"
    implementation "com.google.protobuf:protobuf-java-util:${proto}"
    implementation "io.grpc:grpc-stub:$grcpVersion"
    implementation "io.grpc:grpc-protobuf:$grcpVersion"
    if (JavaVersion.current().isJava9Compatible()) {
        // Workaround for @javax.annotation.Generated
        // see: https://github.com/grpc/grpc-java/issues/3633
        implementation 'javax.annotation:javax.annotation-api:1.3.1'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.0'
}


test {
    useJUnitPlatform()
}


publishing {
    repositories {
        maven {
            name = "Nexus"
            url = uri("http://dwarf.syg:5815/repository/maven-snapshots/")
            allowInsecureProtocol = true
            credentials {
                username = System.getenv("USER_NAME")
                password = System.getenv("USER_PASS")
            }
        }
    }
    publications {
        nexus(MavenPublication) {
            from(components.java)
        }
    }
}
